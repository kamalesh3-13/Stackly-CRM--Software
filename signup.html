<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Stackly</title>
<meta name="description" content="Create your Stackly account and start your first managed plan.">
<link rel="icon" type="image/webp" href="assets/favicon.webp?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/pages.css">
<link rel="stylesheet" href="assets/theme.css?v=12">
<style>body{padding-top:0}.auth-wrap{min-height:100vh}</style>
</head>
<body>
<div id="preloader" aria-hidden="true">
  <div class="pl-inner"><svg class="pl-logo" viewBox="0 0 64 64" width="66" height="66" aria-hidden="true" focusable="false"><path d="M6 16h52L38 38v14a3 3 0 0 1-1.6 2.7l-6 3A2 2 0 0 1 27.5 56V38z" fill="#0E7C6B"/><path d="M6 16h52l-5.5 6.3h-41z" fill="#5EE0C6"/><circle cx="32" cy="6.5" r="3.6" fill="#F2A93B"/></svg><div class="pl-bar"><span></span></div></div>
</div>

<div class="auth-wrap">
  <div class="auth-side">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/logo.webp" alt="Stackly" width="145" height="42">
    </a>
    <div>
      <div class="a-quote">"The weekly check-ins caught a stalled deal before it went cold."</div>
      <div class="a-who">Priya S. — Outreach &amp; Automation, Year 1</div>
    </div>
  </div>
  <div class="auth-form">
    <div class="auth-form-inner">
      <h1>Start selling.</h1>
      <p class="lede">Create your account, then book your free discovery call to lock in a success manager and a plan.</p>
      <form data-signup-form>
        <div class="f-row">
          <div class="f-field"><label>First Name</label><input type="text" placeholder="Jordan" data-name-field required></div>
          <div class="f-field"><label>Last Name</label><input type="text" placeholder="Miles" data-name-field required></div>
        </div>
        <div class="f-field"><label>Register As</label>
          <select id="signupRole">
            <option value="client">Client Dashboard</option>
            <option value="manager">Account Manager Dashboard</option>
          </select>
        </div>
        <div class="f-field"><label>Email</label><input type="email" placeholder="you@email.com" required></div>
        <div class="f-field"><label>Password</label><input type="password" id="signupPassword" placeholder="At least 8 characters" minlength="8" required></div>
        <div class="f-field"><label>Confirm Password</label><input type="password" id="signupConfirmPassword" placeholder="Re-enter your password" minlength="8" required></div>
        <div class="f-msg" id="signupPwMsg" style="display:none; color:var(--ember-deep); font-weight:700; font-size:14px; margin:-10px 0 16px;">Passwords do not match.</div>
        <div class="auth-check">
          <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" style="width:auto;" required> I agree to the Terms &amp; Privacy Policy</label>
        </div>
        <button type="submit" class="btn btn-solid" style="width:100%;">Create Account</button>
      </form>
      <div class="auth-foot">Already using Stackly? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  var form = document.querySelector('[data-signup-form]');
  if(!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = document.getElementById('signupPassword');
    var cpw = document.getElementById('signupConfirmPassword');
    var msg = document.getElementById('signupPwMsg');
    if(pw.value !== cpw.value){
      msg.style.display = 'block';
      cpw.focus();
      return;
    }
    msg.style.display = 'none';
    var btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Creating Account…';
    btn.disabled = true;
    if(typeof gsap !== 'undefined'){
      gsap.to('.auth-form-inner', {opacity:0, y:-14, duration:0.35, ease:'power2.in', onComplete:go});
    } else {
      setTimeout(go, 300);
    }
    function go(){
      var role = document.getElementById('signupRole').value;
      try{
        var ins=form.querySelectorAll('input');
        sessionStorage.setItem('stackly_role', role);
        sessionStorage.setItem('stackly_name',(ins[0].value.trim()+' '+ins[1].value.trim()).trim());
        sessionStorage.setItem('stackly_email',ins[2].value.trim());
      }catch(e){}
      window.location.href = (role === 'manager') ? 'dashboard-manager.html' : 'dashboard-client.html';
    }
  });
})();
</script>
</body>
</html>
